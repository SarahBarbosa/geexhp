name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (no deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps

      - name: Syntax checks
        run: |
          python -m compileall geexhp tests

      - name: Run tests
        run: |
          pip install pytest
          pytest

      - name: Build package
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*
