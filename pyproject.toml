[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geexhp"
version = "1.0.0"
description = "Synthetic reflected-light spectra generation and retrieval utilities for Earth-like exoplanets."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "BSD-2-Clause"
authors = [
  { name = "Sarah G. A. Barbosa", email = "sarahg.aroucha@gmail.com" }
]
keywords = ["exoplanets", "spectroscopy", "machine-learning", "astrobiology", "psg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy==2.1.3",
  "matplotlib==3.10.3",
  "smplotlib==0.0.9",
  "pandas==2.3.0",
  "tqdm==4.67.1",
  "pyarrow==20.0.0",
  "astropy==7.1.0",
  "fastparquet==2024.11.0",
  "PyQt5==5.15.11",
  "tensorflow==2.19.0",
  "scikit-learn==1.6.1",
  "keras-tuner==1.4.7"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.4",
  "ruff>=0.8.6",
  "twine>=5.1.1"
]

[project.urls]
Homepage = "https://github.com/SarahBarbosa/geexhp"
Repository = "https://github.com/SarahBarbosa/geexhp"
Issues = "https://github.com/SarahBarbosa/geexhp/issues"

[tool.setuptools.packages.find]
include = ["geexhp*"]

[tool.setuptools.package-data]
"geexhp.resources" = ["default_habex.txt"]
"geexhp.resources.atmos_layers" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
